<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>休講・補講情報</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
​

<style>
body {
  margin: 0;​
  font-family: "Hiragino Kaku Gothic ProN", "Helvetica Neue", Arial, sans-serif;
  font-size: 46px;
  color: #4b3832;

  /* 背景画像 */
  background-image: url("image/bg.jpg");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

/* 全体レイアウト */
.wrapper {
  display: flex;
  height: calc(100vh - 180px); /* 下のフッター分引く */
  padding: 0px 20px 20px 20px;
  gap: 40px;
  box-sizing: border-box;
  margin-top: 20px;
}

/* 白いカード */
.panel {
  width: 100%;
  overflow-y: auto;
  padding: 20px;
  box-sizing: border-box;
  background: rgba(255, 255, 255, 0.92);
  border-radius: 15px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

/* タイトル */
h1 {
  background: linear-gradient(to right, #fb923c, #f97316);
  color: white;
  text-align: center;
  padding: 2px;
  border-radius: 10px;
  font-size: 2rem;
  margin-top: 15px;
  margin-bottom: 20px;
  font-size: 54px;
}

h2 {
  font-size: 42px;
  color: #ea580c;
  margin-top: 10px;
  margin-bottom: 8px;
  border-bottom: 2px solid #ffe4cc;
}

ul {
  list-style: none;
  padding: 0;
  margin-top: 0;
  font-size: 30px;
}

li {
  background: #fffaf5;
  margin-bottom: 10px;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ffe4cc;
  font-size: 30px;
}

.makeup-panel #makeup-container {
    column-count: 2;
    column-gap: 40px;
    column-fill: auto;
    height: 100%;
}

.day-block{
    break-inside: avoid;
    page-break-inside: avoid;
    margin-bottom: 20px;
}

/* フッター */
.footer {
  height: 160px;
  background: rgba(255,255,255,0.95);

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 5px 30px;
  box-sizing: border-box;
}

.footer-text {
  font-size: 32px;
  font-weight: bold;
  text-align:right;
}

.footer img {
  height: 90px;
}

.qr-box {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform: translateY(-30px);
}

/* ===== 授業評価アンケート案内 ===== */
.survey-banner {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);

  width: 98%;
  height: 60px;

  display: flex;
  justify-content: center;
  align-items: center;

  /*background: rgba(255, 248, 200, 0.95);*/
  /*color: #444;*/
  background: #E3F2FD;
border: 2px solid #64B5F6;
color: #1565C0;

  font-size: 42px;
  font-weight: bold;

  border: 2px solid #FFF450;
  border-radius: 8px;
  box-shadow:
  0 0 0 3px white,
  0 3px 10px rgba(0,0,0,0.15);

  /*box-shadow: 0 3px 10px rgba(0,0,0,0.15);*/


  /*animation: gentleFade 3s ease-in-out infinite;*/
  animation: bounceBanner 3s infinite;
}

/* @keyframes gentleFade {
  0%,100% {
    opacity: 1;
  }
  50% {
    opacity: 0.6;
  }
}*/
@keyframes bounceBanner {
  0%, 100% {
    transform: translateX(-50%) scale(1);
  }
  10% {
    transform: translateX(-50%) scale(1.05, 0.95);
  }
  20% {
    transform: translateX(-50%) scale(0.97, 1.03);
  }
  30% {
    transform: translateX(-50%) scale(1.02);
  }
  40% {
    transform: translateX(-50%) scale(1);
  }
}

.heat-alert {
  flex: 1;
  text-align: left;
  transform: translateY(-30px);
}

.heat-alert span {
  display: inline-block;
  background: orange;
  color: #fff;
  padding: 8px 18px;
  border-radius: 8px;
  font-size: 40px;
  font-weight: bold;
}

.footer-right {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-shrink: 0;
}

.footer-text {
  font-size: 30px;
  font-weight: bold;
  text-align: right;
  transform: translateY(-30px);
}

.footer img {
  width: 90px;
  height: 90px;
  flex-shrink: 0;
}

</style>

</head>

<body>
<div class="survey-banner">
📢 UNIVERSAL PASSPORTから授業評価アンケートの回答をお願いします【7/31まで】
</div>
<div class="wrapper">
  <div class="panel makeup-panel">
    <h1>補　　　講</h1>
    <div id="makeup-container"></div>
  </div>
</div>

<!-- フッター -->
<div class="footer">
  <div class="heat-alert">
    <span>本日の熱中症警戒情報：厳重警戒</span>
  </div>
  
  <div class="footer-right">
  <div class="footer-text">
  詳細はこちらから➡<br>
  お気に入り登録（ブックマーク）してください
  </div>
  <div class="qr-box">
  <img src="image/qr.png" alt="QRコード">
  </div>
  </div>
</div>

<script>
const apiUrl = 'https://script.google.com/macros/s/AKfycbxD6sOKTuscVaMgb60bndlaIQ8ZD_dWdSfq6Xaa_KYxuG9BDU50CTWcnzhJbAQxfAST/exec';

function isTodayOrFuture(dateStr) {
  if (!dateStr) return false;
  const today = new Date();
  today.setHours(0,0,0,0);
  return new Date(dateStr) >= today;
}

function formatJapaneseDate(dateStr) {
  const date = new Date(dateStr);
  const w = ['日','月','火','水','木','金','土'];
  return `${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日（${w[date.getDay()]}）`;
}

fetch(apiUrl)
.then(res => res.json())
.then(data => {

  const cancelGrouped = {};
  const makeupGrouped = {};

  data.forEach(row => {

    if (row['休講日'] && isTodayOrFuture(row['休講日'])) {
      const d = row['休講日'];
      if (!cancelGrouped[d]) cancelGrouped[d] = [];
      cancelGrouped[d].push(row);
    }

    if (row['補講日（確定）'] && isTodayOrFuture(row['補講日（確定）'])) {
      const d = row['補講日（確定）'];
      if (!makeupGrouped[d]) makeupGrouped[d] = [];
      makeupGrouped[d].push(row);
    }

  });

  /*renderCancel(cancelGrouped);*/
  renderMakeup(makeupGrouped);

});


function renderMakeup(grouped) {
  const container = document.getElementById("makeup-container");
  const dates = Object.keys(grouped).sort();

  if (dates.length === 0) {
    container.innerHTML = "<p>現在予定されている補講はありません。</p>";
    return;
  }

  dates.forEach(date => {
    const block = document.createElement("div");
block.className = "day-block";

const h2 = document.createElement("h2");
h2.textContent = formatJapaneseDate(date);
block.appendChild(h2);

const ul = document.createElement("ul");

    grouped[date].sort((a,b)=>{
      return a['補講の時限（確定）'] - b['補講の時限（確定）'];
    });

    grouped[date].forEach(item => {
      const raw = item['科目名'] || '';
      const subject = raw.slice(3);

      const li = document.createElement("li");
      li.textContent = `${item['補講の時限（確定）']}限 / ${subject} / ${item['教員氏名']} / ${item['補講の教室（確定）']}`;
      ul.appendChild(li);
    });

    block.appendChild(ul);
container.appendChild(block);
  });
}

// 10分ごとリロード
setTimeout(() => location.reload(), 600000);
</script>

</body>
</html>
